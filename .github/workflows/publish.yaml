name: Publish @rikalabs npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver to publish
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        default: next
        type: string
      publish:
        description: Publish to npm (false performs npm publish --dry-run)
        required: true
        default: false
        type: boolean

concurrency:
  group: rikalabs-npm-${{ inputs.version }}
  cancel-in-progress: false

env:
  SIDECAR_PLATFORMS: linux-x64-gnu
  RUST_TOOLCHAIN: "1.91.1"
  LINUX_GNU_LLVM_VERSION: "22"
  LINUX_GNU_SYSROOT_TAG: sysroot-20250207
  RELEASE_VERSION: ${{ inputs.version }}
  NPM_TAG: ${{ inputs.tag }}

jobs:
  verify-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter=publish
      - run: pnpm --dir scripts/publish test
      - run: pnpm --dir scripts/publish check-types
      - name: Validate untrusted dispatch inputs
        working-directory: scripts/publish
        run: |
          node -e 'const semver=require("semver"); if (!semver.valid(process.env.RELEASE_VERSION)) process.exit(2)'
          node -e 'if (!/^[a-z0-9][a-z0-9._-]{0,127}$/.test(process.env.NPM_TAG) || require("semver").valid(process.env.NPM_TAG)) process.exit(2)'

  wasm:
    needs: verify-publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1
      - run: pnpm install --frozen-lockfile
      - run: make -C toolchain commands
      - run: node packages/runtime-core/scripts/copy-wasm-commands.mjs --require
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-commands
          path: packages/runtime-core/commands
          if-no-files-found: error

  codex-wasm:
    needs: verify-publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-01
          components: rust-src
          targets: wasm32-wasip1
      - run: sudo apt-get update && sudo apt-get install --yes cmake
      - run: make -C toolchain codex
      - uses: actions/upload-artifact@v4
        with:
          name: codex-wasm
          path: software/codex/wasm
          if-no-files-found: error

  native-linux:
    needs: verify-publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          name: agentos-linux-x64-gnu
      - name: Build with pinned LLVM and compatibility sysroot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build/linux-gnu.Dockerfile
          build-args: |
            TARGET=x86_64-unknown-linux-gnu
            BUILD_PROFILE=release
            CACHE_PLATFORM=linux-x64-gnu
            RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}
            LINUX_GNU_LLVM_VERSION=${{ env.LINUX_GNU_LLVM_VERSION }}
            LINUX_GNU_SYSROOT_TAG=${{ env.LINUX_GNU_SYSROOT_TAG }}
          tags: agentos-linux-linux-x64-gnu
          load: true
      - id: extract
        name: Extract matching binaries
        run: |
          out="target/sidecar-artifacts/linux-x64-gnu"; mkdir -p "$out"
          cid=$(docker create agentos-linux-linux-x64-gnu)
          docker cp "$cid:/artifacts/agentos-sidecar" "$out/agentos-sidecar"
          docker cp "$cid:/artifacts/agentos-native-sidecar" "$out/agentos-native-sidecar"
          docker rm "$cid"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
      - run: scripts/ci/check-linux-glibc-floor.sh "${{ steps.extract.outputs.dir }}/agentos-sidecar" "${{ steps.extract.outputs.dir }}/agentos-native-sidecar"
      - run: scripts/ci/smoke-linux-artifacts.sh binary "${{ steps.extract.outputs.dir }}/agentos-sidecar" "${{ steps.extract.outputs.dir }}/agentos-native-sidecar"
      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-linux-x64-gnu
          path: ${{ steps.extract.outputs.dir }}
          if-no-files-found: error

  npm:
    needs: [verify-publisher, wasm, codex-wasm, native-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-commands
          path: packages/runtime-core/commands
      - uses: actions/download-artifact@v4
        with:
          name: codex-wasm
          path: software/codex/wasm
      - name: Restore software command staging
        run: |
          mkdir -p toolchain/target/wasm32-wasip1/release/commands
          cp -a packages/runtime-core/commands/. toolchain/target/wasm32-wasip1/release/commands/
          test -s toolchain/target/wasm32-wasip1/release/commands/sh
      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-*
          path: artifacts
      - name: Place matching native artifacts
        run: |
          set -euo pipefail
          for platform in $SIDECAR_PLATFORMS; do
            cp "artifacts/sidecar-${platform}/agentos-sidecar" "packages/sidecar-binary/npm/${platform}/agentos-sidecar"
            cp "artifacts/sidecar-${platform}/agentos-native-sidecar" "packages/runtime-sidecar/npm/${platform}/agentos-native-sidecar"
            chmod +x "packages/sidecar-binary/npm/${platform}/agentos-sidecar" "packages/runtime-sidecar/npm/${platform}/agentos-native-sidecar"
          done
      - name: Build npm payloads at release version
        env:
          AGENTOS_SKIP_NATIVE_META_BUILD: "1"
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts bump-versions --version "$RELEASE_VERSION" --version-only
          npx turbo build --filter='!@rivet-dev/agentos-browser' --filter='!@rivet-dev/agentos-runtime-browser' --filter='!@rivet-dev/agentos-playground' --filter='!./examples/*' --filter='!./examples/quickstart/*'
          pnpm --filter=publish exec tsx src/ci/bin.ts bump-versions --version "$RELEASE_VERSION" --repository Rika-Labs/agentos
      - name: Exercise matching native build with Node and Bun
        env:
          AGENTOS_SIDECAR_BIN: ${{ github.workspace }}/packages/sidecar-binary/npm/linux-x64-gnu/agentos-sidecar
        run: |
          pnpm --dir packages/core exec vitest run tests/sidecar-termination.test.ts tests/sidecar-client.test.ts
          timeout 90s node scripts/publish/src/ci/runtime-smoke.mjs @rivet-dev/agentos-core
          timeout 90s bun scripts/publish/src/ci/runtime-smoke.mjs @rivet-dev/agentos-core
      - name: Transform and guard @rikalabs payloads
        run: pnpm --filter=publish exec tsx src/ci/bin.ts prepare-rika-npm
      - name: Install staged release into a clean application
        run: |
          mkdir -p "$RUNNER_TEMP/agentos-installed"
          cp scripts/publish/src/ci/runtime-smoke.mjs "$RUNNER_TEMP/agentos-installed/runtime-smoke.mjs"
          npm --prefix "$RUNNER_TEMP/agentos-installed" install --no-audit --no-fund --package-lock=false "$GITHUB_WORKSPACE"/target/rika-npm/*.tgz
      - name: Exercise installed packages with platform binary resolution
        working-directory: ${{ runner.temp }}/agentos-installed
        run: |
          timeout 90s node runtime-smoke.mjs @rikalabs/agentos-core
          timeout 90s bun runtime-smoke.mjs @rikalabs/agentos-core
      - name: npm dry-run
        if: ${{ !inputs.publish }}
        run: pnpm --filter=publish exec tsx src/ci/bin.ts publish-npm --tag "$NPM_TAG" --expected-scope @rikalabs --dry-run
      - name: Publish @rikalabs packages
        if: ${{ inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          pnpm --filter=publish exec tsx src/ci/bin.ts verify-rika-npm
          pnpm --filter=publish exec tsx src/ci/bin.ts publish-npm --tag "$NPM_TAG" --expected-scope @rikalabs --release-mode --parallel 4 --retries 2
